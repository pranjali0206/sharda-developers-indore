<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#142650" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Enable entrance/reveal motion only for users who have not asked for reduced motion.
      // Runs before first paint so pre-rendered content never flashes or stays hidden.
      (function () {
        try {
          var root = document.documentElement;
          if (window.matchMedia('(prefers-reduced-motion: no-preference)').matches) {
            root.classList.add('motion-ok');
            // Safety net: if the app bundle never starts, show everything.
            setTimeout(function () {
              if (!window.__sdReady) root.classList.remove('motion-ok');
            }, 6000);
          }
        } catch (e) {}
      })();
    </script>
    <!--app-head-->
  </head>
  <body class="bg-bg font-sans text-ink-600 antialiased">
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
